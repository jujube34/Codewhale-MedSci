[package]
name = "medsci-desktop"
version = "0.1.0-preview.7"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
codewhale-config = { path = "../../../crates/config" }
tauri = { version = "2", features = ["macos-private-api"] }
tempfile = "3"
rfd = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks"] }
url = "2"
chrono = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
